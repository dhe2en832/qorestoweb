<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Meja — Qoresto</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // Fallback: jika CDN gagal load, coba dari file lokal
    if (typeof QRCode === 'undefined') {
      document.write('<script src="vendor/qrcode.min.js"><\/script>');
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #3f50b5;
      font-size: 1.4rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    /* ── Mode Toggle ──────────────────────────────────────────────── */
    .mode-toggle {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .mode-toggle button {
      padding: 6px 18px;
      border: 2px solid #3f50b5;
      border-radius: 20px;
      background: #fff;
      color: #3f50b5;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all .15s;
    }

    .mode-toggle button.active {
      background: #3f50b5;
      color: #fff;
    }

    .mode-toggle button.dev-btn {
      border-color: #e67e22;
      color: #e67e22;
    }

    .mode-toggle button.dev-btn.active {
      background: #e67e22;
      color: #fff;
    }

    .mode-badge {
      text-align: center;
      font-size: 0.78rem;
      margin-bottom: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
      width: 100%;
    }

    .mode-badge.prod { color: #27ae60; }
    .mode-badge.dev  { color: #e67e22; }

    /* ── Config Panel ─────────────────────────────────────────────── */
    .config-panel {
      background: #fff;
      border-radius: 8px;
      padding: 16px 20px;
      max-width: 700px;
      margin: 0 auto 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .config-panel label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
      color: #444;
      flex: 1;
      min-width: 140px;
    }

    .config-panel input[type="text"],
    .config-panel input[type="number"] {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      width: 100%;
    }

    .config-panel button {
      padding: 8px 20px;
      background: #3f50b5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
      height: 36px;
      align-self: flex-end;
    }

    .config-panel button:hover { background: #2c3d9c; }

    /* ── Grid QR ──────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .card.dev-card { border: 2px dashed #e67e22; }

    .card .mode-label {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .card .mode-label.prod { background: #eafaf1; color: #27ae60; }
    .card .mode-label.dev  { background: #fef5e7; color: #e67e22; }

    .card .resto-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: #3f50b5;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 4px 0;
    }

    .card .table-label {
      font-size: 1.5rem;
      font-weight: 700;
      color: #222;
      margin-bottom: 10px;
    }

    .card .qr-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .card .scan-hint {
      font-size: 0.72rem;
      color: #555;
      margin-top: 6px;
    }

    /* Backup QR section */
    .card .backup-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #ddd;
    }

    .card .backup-label {
      font-size: 0.62rem;
      color: #999;
      margin-bottom: 6px;
    }

    .card .backup-qr {
      display: flex;
      justify-content: center;
      margin-bottom: 4px;
    }

    .card .url-text {
      font-size: 0.55rem;
      color: #aaa;
      word-break: break-all;
      line-height: 1.3;
      margin-top: 4px;
    }

    /* ── Print ────────────────────────────────────────────────────── */
    @media print {
      body { background: #fff; padding: 0; }
      h1, .subtitle, .mode-toggle, .mode-badge, .config-panel, .print-btn { display: none !important; }
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ddd;
        padding: 12px 8px;
      }
    }

    .print-btn {
      display: block;
      margin: 0 auto 20px;
      padding: 10px 28px;
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    .print-btn:hover { background: #1e8449; }
  </style>
</head>
<body>

  <h1>🍽️ QR Code Meja — Qoresto</h1>
  <p class="subtitle">Tempel QR code ini di masing-masing meja. Customer cukup scan untuk memesan.</p>

  <!-- Mode Toggle -->
  <div class="mode-toggle">
    <button class="prod-btn active" onclick="setMode('prod')">🏪 Production</button>
    <button class="dev-btn"         onclick="setMode('dev')">🛠️ Development</button>
  </div>
  <div class="mode-badge prod" id="modeBadge">
    ✅ Mode: <b>Production</b> — QR mengarah ke server production
  </div>

  <!-- Config Panel -->
  <div class="config-panel">
    <label>
      URL Server Utama
      <input type="text" id="baseUrl" value="http://192.168.100.13/qorestoweb/menu" />
    </label>
    <label>
      URL Server Cadangan
      <input type="text" id="backupUrl" value="http://192.168.100.85/qorestoweb/menu" />
    </label>
    <label>
      Nama Restoran
      <input type="text" id="restoName" value="Qoresto" />
    </label>
    <label>
      Jumlah Meja
      <input type="number" id="tableCount" value="20" min="1" max="100" />
    </label>
    <label>
      Nomor Awal
      <input type="number" id="tableStart" value="1" min="1" />
    </label>
    <button onclick="generate()">Generate</button>
  </div>

  <button class="print-btn" onclick="window.print()">🖨️ Print Semua QR Code</button>

  <div class="grid" id="qrGrid"></div>

  <script>
    const devHost = window.location.hostname;
    const PRESETS = {
      prod: { primary: 'http://192.168.100.13/qorestoweb/menu', backup: 'http://192.168.100.85/qorestoweb-cad/menu' },
      dev:  { primary: `http://${devHost}:3000/menu`, backup: '' },
    };

    let currentMode = 'prod';

    function setMode(mode) {
      currentMode = mode;
      document.querySelector('.prod-btn').classList.toggle('active', mode === 'prod');
      document.querySelector('.dev-btn').classList.toggle('active', mode === 'dev');

      const badge = document.getElementById('modeBadge');
      if (mode === 'prod') {
        badge.className = 'mode-badge prod';
        badge.innerHTML = '✅ Mode: <b>Production</b> — QR utama + cadangan';
      } else {
        badge.className = 'mode-badge dev';
        badge.innerHTML = `🛠️ Mode: <b>Development</b> — URL: <code>${PRESETS.dev.primary}</code>`;
      }

      document.getElementById('baseUrl').value   = PRESETS[mode].primary;
      document.getElementById('backupUrl').value  = PRESETS[mode].backup;
      generate();
    }

    function padNum(n, len) {
      return String(n).padStart(len, '0');
    }

    function generate() {
      const baseUrl   = document.getElementById('baseUrl').value.trim();
      const backupUrl = document.getElementById('backupUrl').value.trim();
      const restoName = document.getElementById('restoName').value.trim() || 'Qoresto';
      const count     = parseInt(document.getElementById('tableCount').value) || 10;
      const startNum  = parseInt(document.getElementById('tableStart').value) || 1;
      const grid      = document.getElementById('qrGrid');
      const isDev     = currentMode === 'dev';

      const padLen = String(startNum + count - 1).length;
      grid.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const num     = startNum + i;
        const tableId = padNum(num, padLen);
        const urlPrimary = `${baseUrl}?table=${tableId}`;
        const urlBackup  = backupUrl ? `${backupUrl}?table=${tableId}` : '';

        const card = document.createElement('div');
        card.className = isDev ? 'card dev-card' : 'card';

        let backupHTML = '';
        if (urlBackup && !isDev) {
          backupHTML = `
            <div class="backup-section">
              <div class="backup-label">⚠️ Jika tidak bisa dibuka, scan ini:</div>
              <div class="backup-qr" id="qr-backup-${tableId}"></div>
              <div class="url-text">${urlBackup}</div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="mode-label ${isDev ? 'dev' : 'prod'}">${isDev ? '🛠 DEV' : '🏪 PROD'}</div>
          <div class="resto-name">${restoName}</div>
          <div class="table-label">Meja ${tableId}</div>
          <div class="qr-wrapper" id="qr-${tableId}"></div>
          <div class="scan-hint">📱 Scan untuk memesan</div>
          ${backupHTML}
        `;
        grid.appendChild(card);

        // QR utama — besar
        new QRCode(document.getElementById(`qr-${tableId}`), {
          text:         urlPrimary,
          width:        150,
          height:       150,
          colorDark:    isDev ? '#c0390b' : '#222222',
          colorLight:   '#ffffff',
          correctLevel: QRCode.CorrectLevel.M,
        });

        // QR cadangan — kecil
        if (urlBackup && !isDev) {
          new QRCode(document.getElementById(`qr-backup-${tableId}`), {
            text:         urlBackup,
            width:        80,
            height:       80,
            colorDark:    '#666666',
            colorLight:   '#ffffff',
            correctLevel: QRCode.CorrectLevel.L,
          });
        }
      }
    }

    window.addEventListener('load', generate);
  </script>

</body>
</html>
