<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Meja — Qoresto</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f0f0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      color: #3f50b5;
      font-size: 1.4rem;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    /* ── Config Panel ─────────────────────────────────────────────── */
    .config-panel {
      background: #fff;
      border-radius: 8px;
      padding: 16px 20px;
      max-width: 600px;
      margin: 0 auto 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .config-panel label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.82rem;
      color: #444;
      flex: 1;
      min-width: 160px;
    }

    .config-panel input[type="text"],
    .config-panel input[type="number"] {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      width: 100%;
    }

    .config-panel button {
      padding: 8px 20px;
      background: #3f50b5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
      height: 36px;
      align-self: flex-end;
    }

    .config-panel button:hover { background: #2c3d9c; }

    /* ── Grid QR ──────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .card .resto-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: #3f50b5;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .card .table-label {
      font-size: 1.5rem;
      font-weight: 700;
      color: #222;
      margin-bottom: 12px;
    }

    .card .qr-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .card .url-text {
      font-size: 0.62rem;
      color: #888;
      word-break: break-all;
      line-height: 1.4;
    }

    .card .scan-hint {
      font-size: 0.72rem;
      color: #555;
      margin-top: 8px;
    }

    /* ── Print ────────────────────────────────────────────────────── */
    @media print {
      body { background: #fff; padding: 0; }
      h1, .subtitle, .config-panel, .print-btn { display: none !important; }
      .grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ddd;
        padding: 12px;
      }
    }

    .print-btn {
      display: block;
      margin: 0 auto 20px;
      padding: 10px 28px;
      background: #27ae60;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .print-btn:hover { background: #1e8449; }
  </style>
</head>
<body>

  <h1>🍽️ QR Code Meja — Qoresto</h1>
  <p class="subtitle">Tempel QR code ini di masing-masing meja. Customer cukup scan untuk memesan.</p>

  <!-- Config Panel -->
  <div class="config-panel">
    <label>
      Base URL Server
      <input type="text" id="baseUrl" value="http://192.168.100.13/qorestoweb/menu" />
    </label>
    <label>
      Nama Restoran
      <input type="text" id="restoName" value="Qoresto" />
    </label>
    <label>
      Jumlah Meja
      <input type="number" id="tableCount" value="20" min="1" max="100" />
    </label>
    <label>
      Nomor Awal
      <input type="number" id="tableStart" value="1" min="1" />
    </label>
    <button onclick="generate()">Generate</button>
  </div>

  <button class="print-btn" onclick="window.print()">🖨️ Print Semua QR Code</button>

  <div class="grid" id="qrGrid"></div>

  <script>
    function padNum(n, len) {
      return String(n).padStart(len, '0');
    }

    function generate() {
      const baseUrl    = document.getElementById('baseUrl').value.trim();
      const restoName  = document.getElementById('restoName').value.trim() || 'Qoresto';
      const count      = parseInt(document.getElementById('tableCount').value) || 10;
      const startNum   = parseInt(document.getElementById('tableStart').value) || 1;
      const grid       = document.getElementById('qrGrid');

      // Tentukan padding — misal 20 meja → pad 2 digit (01..20)
      const padLen = String(startNum + count - 1).length;

      // Bersihkan grid lama
      grid.innerHTML = '';

      for (let i = 0; i < count; i++) {
        const num     = startNum + i;
        const tableId = padNum(num, padLen);
        const url     = `${baseUrl}?table=${tableId}`;

        // Buat card
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="resto-name">${restoName}</div>
          <div class="table-label">Meja ${tableId}</div>
          <div class="qr-wrapper" id="qr-${tableId}"></div>
          <div class="url-text">${url}</div>
          <div class="scan-hint">📱 Scan untuk memesan</div>
        `;
        grid.appendChild(card);

        // Generate QR
        new QRCode(document.getElementById(`qr-${tableId}`), {
          text:          url,
          width:         150,
          height:        150,
          colorDark:     '#222222',
          colorLight:    '#ffffff',
          correctLevel:  QRCode.CorrectLevel.M,
        });
      }
    }

    // Auto-generate saat halaman load
    window.addEventListener('load', generate);
  </script>

</body>
</html>
